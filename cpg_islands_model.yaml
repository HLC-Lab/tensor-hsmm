# HSMM model definition for cpg_islands_finder.py.
# Mirrors what used to be hardcoded in build_cpg_hsmm().

states: ["Background", "CpG-island"]

# k-mer size used to read the FASTA file (see modules.genomics.FastaReader).
# k=1 -> single-base composition only (GC content).
# k=2 -> dinucleotides, captures CG-suppression vs. non-suppression, the
#        actual biological hallmark of CpG islands.
k: 2

emissions:
  # Marginal single-base composition per state, order: A, T, C, G.
  background_marginal: [0.30, 0.30, 0.20, 0.20]  # typical bulk genomic composition
  island_marginal:     [0.15, 0.15, 0.35, 0.35]  # C/G enriched

  # Only used when k == 2. CpG islands aren't just GC-rich — the defining
  # feature is the CG dinucleotide itself: genome-wide it's strongly
  # suppressed (methylated C deaminates to T over evolutionary time), while
  # inside CpG islands that suppression is absent (unmethylated), so CG
  # shows up close to its "expected" frequency, or above it.
  cg_suppression_background: 0.25  # ~4x depleted vs. the naive expectation
  cg_enrichment_island: 1.5        # unsuppressed, and then some

duration:
  D: 1000  # max duration; uniform 1/D per state

# Optional — omit either to default to a uniform distribution.
# transitions:
#   - [0.5, 0.5]
#   - [0.5, 0.5]
# start_probs: [0.5, 0.5]
